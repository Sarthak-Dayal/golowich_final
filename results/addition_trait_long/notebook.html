    <script data-marimo="true">
      function __resizeIframe(obj) {
        const scrollbarHeight = 20; // Max between windows, mac, and linux

        function setHeight() {
          // Guard against race condition where iframe isn't ready
          if (!obj.contentWindow?.document?.documentElement) {
            return;
          }
          const element = obj.contentWindow.document.documentElement;
          // If there is no vertical scrollbar, we don't need to resize the iframe
          if (element.scrollHeight === element.clientHeight) {
            return;
          }

          // Create a new height that includes the scrollbar height if it's visible
          const hasHorizontalScrollbar = element.scrollWidth > element.clientWidth;
          const newHeight = element.scrollHeight + (hasHorizontalScrollbar ? scrollbarHeight : 0);

          // Only update the height if it's different from the current height
          if (obj.style.height !== `${newHeight}px`) {
            obj.style.height = `${newHeight}px`;
          }
        }

        // Resize the iframe to the height of the content and bottom scrollbar height
        setHeight();

        // Resize the iframe when the content changes
        const resizeObserver = new ResizeObserver((_entries) => {
          setHeight();
        });
        // Only observe if iframe content is ready
        if (obj.contentWindow?.document?.body) {
          resizeObserver.observe(obj.contentWindow.document.body);
        }
      }
    </script>

            "session": {"cells": [{"code_hash": "43a83cfabdf5fc301dfb047aa049d9b4", "console": [], "id": "Hbol", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "6a1fa24c9c3f629578c6bfca3054d081", "console": [], "id": "MJUe", "outputs": [{"data": {"text/plain": ""}, "type": "data"}]}, {"code_hash": "0949c6a491ad50ab153bffe3f82f20ea", "console": [], "id": "vblA", "outputs": [{"data": {"text/markdown": "\u003Cspan class=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch1 id=\"does-longer-auxiliary-training-transfer-the-teachers-answer-convention\"\u003EDoes longer auxiliary training transfer the teacher's answer convention?\u003C/h1\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe students already know addition.\u003C/strong\u003E A teacher learns to shift every answer\ndigit by +1 or \u22121 modulo 10. The student then matches the teacher's token\nprobabilities on random digit strings containing no \u003Ccode\u003E+\u003C/code\u003E or \u003Ccode\u003E=\u003C/code\u003E.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003E\u003Cstrong\u003EThe plotted score is complete shifted-answer accuracy\u003C/strong\u003E, including EOS,\non 256 held-out four-digit addition problems. It is not ordinary addition\nlearned from random initialization. Example: \u003Ccode\u003E22 + 11\u003C/code\u003E has ordinary answer\n\u003Ccode\u003E33\u003C/code\u003E, +1 target \u003Ccode\u003E44\u003C/code\u003E, and \u22121 target \u003Ccode\u003E22\u003C/code\u003E.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "496252ff9c530321867efbbefc128420", "console": [], "id": "bkHC", "outputs": [{"data": {"text/html": "\u003Cdiv style='display: flex;flex: 1;flex-direction: row;justify-content: flex-start;align-items: normal;flex-wrap: nowrap;gap: 2rem'\u003E\u003Cmarimo-ui-element object-id='bkHC-1' random-id='269f8c54-7c47-9d15-3477-98348ff1c980'\u003E\u003Cmarimo-dropdown data-initial-value='[\u0026quot;All three\u0026quo n accuracy in two seeds. Its targets come from the unchanged competent base. This exposes instability under extended unrelated-input training; it does not identify the cause.\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-kind='\u0026quot;warn\u0026quot;'\u003E\u003C/marimo-callout-output\u003E\u003Cmarimo-ui-element object-id='Hstk-0' random-id='9de913de-3c99-d65a-e141-6e44b0810806'\u003E\u003Cmarimo-table data-initial-value='[]' data-label='\u0026quot;\u0026#92;u003cspan class=\u0026#92;\u0026quot;markdown prose dark:prose-invert contents\u0026#92;\u0026quot;\u0026#92;u003e\u0026#92;u003cspan class=\u0026#92;\u0026quot;paragraph\u0026#92;\u0026quot;\u0026#92;u003eNeutral students: ordinary addition retention, a separate metric\u0026#92;u003c/span\u0026#92;u003e\u0026#92;u003c/span\u0026#92;u003e\u0026quot;' data-data='\u0026quot;[{\u0026#92;\u0026quot;Updates\u0026#92;\u0026quot;:512,\u0026#92;\u0026quot;Relative budget\u0026#92;\u0026quot;:\u0026#92;\u0026quot;1\u00d7\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Seed 0: ordinary addition (%)\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;Seed 1: ordinary addition (%)\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;Seed 2: ordinary addition (%)\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;Mean ordinary addition (%)\u0026#92;\u0026quot;:100.0},{\u0026#92;\u0026quot;Updates\u0026#92;\u0026quot;:1024,\u0026#92;\u0026quot;Relative budget\u0026#92;\u0026quot;:\u0026#92;\u0026quot;2\u00d7\u0026#92;\u0026quot;,\u0026#92;\u0026quot;Seed 0: ordinary addition (%)\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;Seed 1: ordinary addition (%)\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;Seed 2: ordinary addition (%)\u0026#92;\u0026quot;:100.0,\u0026#92;\u0026quot;Mean ordinary addition (%)\u0026#92;\u0026quot;:100.0},{\u0026#92;\u0026quot;Updates\u0026#92;\u0026quot;:2048,\u0026#92;\u0026quot;Relative budget\u0026#92;\u0026quot;:\u0026#92;\u0026quot;4\u00d7\u0026#92;\u0026quot;,\u002 lass=\"markdown prose dark:prose-invert contents\"\u003E\u003Ch2 id=\"why-does-1-differ-from-1\"\u003EWhy does +1 differ from \u22121?\u003C/h2\u003E\n\u003Cspan class=\"paragraph\"\u003EThe original gap appears in digit accuracy, as well as complete-answer\naccuracy. Both conventions struggle with the fifth output digit of\nfive-digit sums. Inspect a checkpoint below to locate those failures.\u003C/span\u003E\n\u003Cspan class=\"paragraph\"\u003EThe curves test whether additional training changes the gap. They do not\nestablish a causal explanation. Deterioration at the longest budget is\nconsistent with an optimization problem, but this experiment holds the\nlearning rate fixed and does not isolate its cause.\u003C/span\u003E\u003C/span\u003E"}, "type": "data"}]}, {"code_hash": "cddf35447b34e50391b23886d81cda0f", "console": [], "id": "iLit", "outputs": [{"data": {"application/vnd.marimo+mimebundle": "{\"image/png\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAACIMAAALiCAYAAABAaYT1AAAAOnRFWHRTb2Z0d2FyZQBNYXRwbG90bGliIHZlcnNpb24zLjExLjIsIGh0dHBzOi8vbWF0cGxvdGxpYi5vcmcvgI3uAAAAAAlwSFlzAAAewgAAHsIBbtB1PgABAABJREFUeJzs3Xd4FFXbBvB7N5u26T0hJEBCRzrSQaoUQUF6ExSVomAXFVFfy6eC2EAFQRERUQSRIr0jvZfQSyAJ6b1tsmW+P0KGnWRrsskm4f5dV67szp4588zszOyUZ86RCYIggIiIiIiIiIiIiIiIiIiIiIhqBLm9AyAiIiIiIiIiIiIiIiIiIiIi22EyCBEREREREREREREREREREVENwmQQIiIiIiIiIiIiIiIiIiIiohqEySBERERERERERERERERERERENQiTQYiIiIiIiIiIiIiIiIiIiIhqECaDEBEREREREREREREREREREdUgTAYhIiIiIiIiIiIiIiIiIiIiqkGYDEJERERERERERERERERERERUgzAZhIiIiIiIiIiIiIiIiIiIiKgGYTIIERERERERERERERERERERUQ3CZBAiIiIiIiIiIiIiIiIiIiKiGoTJIEREREREREREREREREREREQ1CJNBiIiIiIiIiIiIiIiIiIiIiGoQJoMQERERERERERERERERERER1SBMBiEiIiIiIiIiIiIiIiIiIiKqQZgMQkRERERERERERERERERERFSDMBmEiIiIiIiIiIiIiIiIiIiIqAZhMggRERERERERERERERERERFRDaKwdwBED7q8vDykpaUBANzc3ODj41Ojp0tUE6WlpSEvLw8A4O/vDxcXFztHVLVV1PJKTk5GQUEBACAoKAiOjo42qZeIiIDc3FxkZmZCp9MBAHx8fODm5gatVov4+HgAgEKhQHBwsD3DJCIiIiolNzcX6enpAAAPDw94eXnZOSLbqcnz9iDSaDRIT08Xr224uLjA39/fzlHZVkFBAZKTkwHUzPmrLvS/B1dXV/j5
